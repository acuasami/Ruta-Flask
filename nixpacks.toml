# nixpacks.toml

# ✅ SOLUCIÓN FINAL: Usamos el sistema APT nativo para asegurar la compatibilidad con las librerías C/C++.
# Esto a menudo resuelve los fallos de enlace que NixPkgs no puede.
[phases.setup]
aptPackages = ["libgdal-dev", "libgeos-dev"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT app:app --workers 1"
