# nixpacks.toml (Versión Minimalista con lo Esencial)

# Usamos el sistema Nix para incluir solo las dependencias C/C++ esenciales,
# evitando conflictos de versiones.
[phases.setup]
nixPkgs = [
  "gdal",    # GDAL y sus dependencias (PROJ)
  "geos"     # GEOS
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT app:app --workers 1"
