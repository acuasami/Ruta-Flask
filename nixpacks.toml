# nixpacks.toml

# Incluimos los paquetes de sistema GEOS y GDAL que necesita Python.
# Hemos eliminado las líneas de "export" que estaban causando el conflicto de compilación.
[phases.setup]
nixPkgs = [
  "gdal",    
  "geos",     
  "pkg-config" # Ayuda al compilador a encontrar las librerías
]

[phases.install]
# Simplemente le pedimos a pip que instale, confiando en que Nix ya ha configurado las rutas.
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT app:app --workers 1"
