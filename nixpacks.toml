# nixpacks.toml

# Usamos el sistema Nix para incluir paquetes con todas sus dependencias
# transitivas, una forma más robusta que aptPackages.
[phases.setup]
nixPkgs = [
  "python3",
  "pkg-config", 
  "gdal",       # Dependencia principal para geopandas/osmnx
  "geos"        # Dependencia principal para shapely/geopandas
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT app:app --workers 1"
